name: macOS memory cap probes

"on":
  workflow_dispatch:
    inputs:
      allocator_profile:
        description: Explicit own-child allocator diagnostic
        type: choice
        options: [default, nano-off]
        default: default

permissions:
  contents: read

concurrency:
  group: macos-memory-probes-${{ github.ref }}-${{ inputs.allocator_profile || 'default' }}
  cancel-in-progress: false

# Observe fixed and explicitly separate diagnostic memory caps on native owned children.
# This does not admit lifetime tests, change the runtime, or qualify an SDK.
jobs:
  host:
    name: macOS ${{ matrix.host.arch }} memory cap
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      NIL_CI_ARCH: ${{ matrix.host.arch }}
      NIL_CI_RUNNER: ${{ matrix.host.runner }}
      NIL_CI_ALLOCATOR_PROFILE: ${{ inputs.allocator_profile || 'default' }}
      PYTHONDONTWRITEBYTECODE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record source and host
        id: identity
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=15).strip()
          assert platform.system() == 'Darwin'
          assert platform.machine() == os.environ['NIL_CI_ARCH']
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert not git('status', '--porcelain', '--untracked-files=no')
          root = Path('build/macos-memory-evidence')
          root.mkdir(parents=True, exist_ok=False)
          identity = dict(revision=git('rev-parse', 'HEAD'), architecture=platform.machine(),
                          platform=platform.platform(), python=sys.version,
                          runner=os.environ['NIL_CI_RUNNER'], run_id=os.environ['GITHUB_RUN_ID'],
                          allocator_profile=os.environ['NIL_CI_ALLOCATOR_PROFILE'],
                          attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                          image_os=os.environ.get('ImageOS'), image_version=os.environ.get('ImageVersion'),
                          scope='Own-child memory cap observations only; no lifetime-test admission or SDK qualification')
          (root / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Check bounded observation controls
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          set -o pipefail
          python3 -B scripts/ci/test_macos_memory_probes.py -v \
            2>&1 | tee build/macos-memory-evidence/controls.log
      - name: Observe setup, exec and bounded allocation outcomes
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          python3 -B scripts/ci/macos-memory-probes.py --output build/macos-memory-evidence/probe \
            --allocator-profile "$NIL_CI_ALLOCATOR_PROFILE" \
            2>&1 | tee build/macos-memory-evidence/probe.log
      - name: Seal raw observations
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B - <<'PY'
          import hashlib, json, stat, subprocess
          from pathlib import Path
          root = Path('build/macos-memory-evidence')
          root.mkdir(parents=True, exist_ok=True)
          records = {}
          for path in sorted(root.rglob('*')):
              mode = path.lstat().st_mode
              assert stat.S_ISREG(mode) or stat.S_ISDIR(mode), str(path)
              if stat.S_ISREG(mode):
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      while chunk := stream.read(1024 * 1024):
                          digest.update(chunk)
                  records[str(path.relative_to(root))] = dict(bytes=path.stat().st_size, sha256=digest.hexdigest())
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'],
                                          text=True, timeout=15)
          (root / 'evidence.json').write_text(json.dumps(dict(source_unchanged=not dirty,
                                              tracked_changes=dirty, files=records), indent=2) + '\n')
          assert not dirty, dirty
          PY
      - name: Upload bounded memory cap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-memory-probes-${{ inputs.allocator_profile || 'default' }}-${{ matrix.host.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/macos-memory-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
