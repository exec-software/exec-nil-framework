name: macOS AppKit provider checks

"on":
  workflow_dispatch:
    inputs:
      architecture:
        description: Host architecture to check
        type: choice
        options: [both, x86_64, arm64]
        default: both
      scope:
        description: provider contract only, or the language-level display contract
        type: choice
        options: [provider, display]
        default: provider
      llvm:
        description: Enable native application routes in the display campaign
        type: choice
        options: ["OFF", "ON"]
        default: "OFF"

permissions:
  contents: read

concurrency:
  group: macos-appkit-provider-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

# Provider-only checks keep LLVM off. The display campaign can enable native
# application routes. Neither scope qualifies or publishes an SDK.
jobs:
  provider:
    if: ${{ inputs.scope == 'provider' }}
    name: macOS ${{ matrix.host.arch }} AppKit provider
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-15","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15-intel","arch":"x86_64"},{"runner":"macos-15","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      # Official v5 tag commit, matching the other workflows in this repository.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Report the desktop session
        timeout-minutes: 2
        run: |
          echo "runner arch: $(uname -m)"
          # A provider that cannot reach a window server can still build, so
          # record the session before anything is interpreted as a provider
          # fault.
          /usr/bin/python3 -c "
          import ctypes, ctypes.util
          core = ctypes.CDLL(ctypes.util.find_library('CoreGraphics'))
          core.CGMainDisplayID.restype = ctypes.c_uint32
          print('CGMainDisplayID:', core.CGMainDisplayID())
          "
      - name: Configure without LLVM
        timeout-minutes: 8
        run: |
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DNIL_ENABLE_LLVM=OFF
      - name: Build the AppKit provider and its fixture
        timeout-minutes: 20
        run: cmake --build build/ci --target nil_ui_runtime_appkit_tests --parallel 3
      - name: Availability without opening a display
        timeout-minutes: 2
        run: ./build/ci/bin/nil_ui_runtime_appkit_tests --provider-present
      - name: Provider contract against a real session
        timeout-minutes: 5
        run: ./build/ci/bin/nil_ui_runtime_appkit_tests --display
      # Cross-process input needs accessibility trust a runner does not grant,
      # so real keyboard input is exercised inside the process instead.
      - name: Real keyboard input, in process
        timeout-minutes: 5
        run: ./build/ci/bin/nil_ui_runtime_appkit_tests --input-probe

  display:
    if: ${{ inputs.scope == 'display' }}
    name: macOS ${{ matrix.host.arch }} AppKit display / LLVM ${{ inputs.llvm }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-15","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15-intel","arch":"x86_64"},{"runner":"macos-15","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash
    env:
      NIL_CI_LLVM: ${{ inputs.llvm }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Report the desktop session
        timeout-minutes: 2
        run: |
          /usr/bin/python3 -c "
          import ctypes, ctypes.util
          core = ctypes.CDLL(ctypes.util.find_library('CoreGraphics'))
          core.CGMainDisplayID.restype = ctypes.c_uint32
          print('CGMainDisplayID:', core.CGMainDisplayID())
          "
      # The language-level contract needs the compiler, interpreter and test
      # runner as well as the provider. LLVM ON adds actual native cases.
      - name: Configure the selected application routes
        timeout-minutes: 8
        run: |
          nil_llvm_args=()
          if [ "$NIL_CI_LLVM" = ON ]; then
            nil_llvm_prefix="$(brew --prefix llvm@18)"
            test -x "$nil_llvm_prefix/bin/llvm-config"
            nil_llvm_args+=("-DLLVM_DIR=$nil_llvm_prefix/lib/cmake/llvm")
          fi
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DNIL_ENABLE_LLVM="$NIL_CI_LLVM" "${nil_llvm_args[@]}"
      - name: Build
        timeout-minutes: 40
        run: >-
          cmake --build build/ci --parallel 2 --target nilcompiler nilinterpreter
          niltest nil_ui_runtime_appkit_tests nil_ui_lifecycle_tests nil_ui_appkit_input_driver
          nil_ui_appkit_compile_driver nil_ui_layout_tests
      - name: Language-level desktop contract
        timeout-minutes: 15
        run: |
          # Anchor the product namespace: 'nil.ui' also matches nilbuild.*.
          ctest --test-dir build/ci -R '^nil[.]ui([.-]|$)' \
            --no-tests=error --output-on-failure --output-junit appkit-display-results.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('build/ci/appkit-display-results.xml').getroot().iter('testcase'))
          expected = {'nil.ui-runtime', 'nil.ui-layout', 'nil.ui-windows-display-harness', 'nil.ui-appkit-display-harness', 'nil.ui-display',
                      'nil.ui-intrinsic-contract', 'nil.ui-models'}
          assert len(cases) == len(expected) and {case.get('name') for case in cases} == expected
          assert all(case.get('status') == 'run' and case.find('skipped') is None and
                     case.find('failure') is None and case.find('error') is None for case in cases)
          PY
      - name: Preserve complete or partial application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appkit-display-${{ matrix.host.arch }}-llvm-${{ inputs.llvm }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/ci/appkit-display-results.xml
            build/ci/Testing/Temporary/LastTest.log
            build/ci/CMakeCache.txt
            build/ci/appkit-input-evidence/
          if-no-files-found: error
          retention-days: 14
