name: macOS directed UI prerequisites

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ui-directed-probes-${{ github.ref }}
  cancel-in-progress: false

# Exercise only the verified child application's native window. No global input,
# permission prompts, TCC changes, GTK admission or SDK qualification.
jobs:
  host:
    name: macOS ${{ matrix.host.arch }} directed UI
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    defaults:
      run:
        shell: bash
    env:
      NIL_CI_ARCH: ${{ matrix.host.arch }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check directed input controls
        timeout-minutes: 2
        run: |
          mkdir -p build/macos-ui-directed-evidence
          set -o pipefail
          python3 -B scripts/ci/test_macos_ui_directed_probes.py -v \
            2>&1 | tee build/macos-ui-directed-evidence/controls.log
      - name: Observe owned child keyboard and native close delivery
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 -B scripts/ci/macos-ui-directed-probes.py \
            --output "$GITHUB_WORKSPACE/build/macos-ui-directed-evidence/probe" \
            --work-dir "$RUNNER_TEMP/nil-ui-directed-probe" \
            --revision "$GITHUB_SHA" --architecture "$NIL_CI_ARCH" \
            2>&1 | tee build/macos-ui-directed-evidence/probe.log
      - name: Seal complete or partial directed UI evidence
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          root = Path('build/macos-ui-directed-evidence'); root.mkdir(parents=True, exist_ok=True)
          files = {}
          for path in sorted(root.rglob('*')):
              mode = path.lstat().st_mode
              assert stat.S_ISDIR(mode) or stat.S_ISREG(mode), str(path)
              if stat.S_ISREG(mode):
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      while block := stream.read(1024**2): digest.update(block)
                  files[path.relative_to(root).as_posix()] = {
                      'bytes': path.stat().st_size, 'sha256': digest.hexdigest()}
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'],
                                          text=True, timeout=15)
          (root / 'evidence.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'], 'architecture': os.environ['NIL_CI_ARCH'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_unchanged': not dirty, 'tracked_changes': dirty, 'files': files,
              'qualification': False, 'sdk_replaced': False}, indent=2) + '\n')
          assert not dirty
          PY
      - name: Upload directed UI evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-ui-directed-probes-${{ matrix.host.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/macos-ui-directed-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
