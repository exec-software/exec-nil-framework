name: macOS GTK development checks

"on":
  workflow_dispatch:
    inputs:
      architecture:
        description: Native private provider architecture
        type: choice
        options: [both, x86_64, arm64]
        default: both

permissions:
  contents: read

concurrency:
  group: macos-gtk-provider-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

# Build an isolated GTK prefix and exercise its public API and product runtime.
# No Homebrew/global Python updates, SDK activation or release publication.
jobs:
  provider:
    name: macOS ${{ matrix.host.arch }} private GTK
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"runner":"macos-15","arch":"arm64"}]' || inputs.architecture == 'x86_64' && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15-intel","arch":"x86_64"},{"runner":"macos-15","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash
    env:
      NIL_CI_ARCH: ${{ matrix.host.arch }}
      PYTHONDONTWRITEBYTECODE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check private provider controls
        timeout-minutes: 2
        run: |
          mkdir -p build/macos-gtk-evidence
          set -o pipefail
          python3 -B scripts/ci/test_macos_gtk_provider.py -v \
            2>&1 | tee build/macos-gtk-evidence/controls.log
          python3 -B scripts/ci/test_macos_gtk_runtime.py -v \
            2>&1 | tee build/macos-gtk-evidence/runtime-controls.log
          python3 -B scripts/ci/test_macos_gtk_directed_probes.py -v \
            2>&1 | tee build/macos-gtk-evidence/directed-controls.log
      - name: Build pinned provider and run owned public-API smoke
        id: provider
        timeout-minutes: 32
        run: |
          set -o pipefail
          python3 -B scripts/ci/macos-gtk-provider.py \
            --output "$GITHUB_WORKSPACE/build/macos-gtk-evidence/provider" \
            --work-dir "$RUNNER_TEMP/nil-private-gtk" \
            --revision "$GITHUB_SHA" --architecture "$NIL_CI_ARCH" \
            2>&1 | tee build/macos-gtk-evidence/provider.log
      - name: Check product runtime against the sealed private provider
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 -B scripts/ci/macos-gtk-runtime.py \
            --provider-report "$GITHUB_WORKSPACE/build/macos-gtk-evidence/provider/report.json" \
            --output "$GITHUB_WORKSPACE/build/macos-gtk-evidence/runtime" \
            --work-dir "$RUNNER_TEMP/nil-gtk-runtime" \
            --revision "$GITHUB_SHA" --architecture "$NIL_CI_ARCH" \
            2>&1 | tee build/macos-gtk-evidence/runtime.log
      - name: Observe directed input to an owned GTK child
        if: ${{ !cancelled() && steps.provider.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 -B scripts/ci/macos-gtk-directed-probes.py \
            --provider-report "$GITHUB_WORKSPACE/build/macos-gtk-evidence/provider/report.json" \
            --output "$GITHUB_WORKSPACE/build/macos-gtk-evidence/directed" \
            --work-dir "$RUNNER_TEMP/nil-gtk-directed" \
            --revision "$GITHUB_SHA" --architecture "$NIL_CI_ARCH" \
            2>&1 | tee build/macos-gtk-evidence/directed.log
      - name: Seal complete or partial provider evidence
        if: always()
        timeout-minutes: 2
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          root = Path('build/macos-gtk-evidence'); root.mkdir(parents=True, exist_ok=True)
          files = {}
          for path in sorted(root.rglob('*')):
              mode = path.lstat().st_mode
              assert stat.S_ISDIR(mode) or stat.S_ISREG(mode), str(path)
              if stat.S_ISREG(mode):
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      while block := stream.read(1024**2): digest.update(block)
                  files[path.relative_to(root).as_posix()] = {
                      'bytes': path.stat().st_size, 'sha256': digest.hexdigest()}
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'],
                                          text=True, timeout=15)
          (root / 'evidence.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'], 'architecture': os.environ['NIL_CI_ARCH'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'source_unchanged': not dirty, 'tracked_changes': dirty,
              'files': files, 'qualification': False, 'sdk_replaced': False}, indent=2) + '\n')
          assert not dirty
          PY
      - name: Upload private provider evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-gtk-provider-${{ matrix.host.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/macos-gtk-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
