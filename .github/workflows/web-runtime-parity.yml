name: Web runtime platform checks

"on":
  pull_request:
    paths:
      - '.github/workflows/web-runtime-parity.yml'
      - 'CMakeLists.txt'
      - 'nilcompiler/**'
      - 'nilstd/**'
      - 'tests/net_*'
      - 'tests/file_time_support_tests.cpp'
      - 'tests/rooted_file_snapshot_tests.cpp'
      - 'tests/tools/net_socket_contract.py'
      - 'tests/tools/file_modified_at_contract.py'
      - 'tests/tools/rooted_file_snapshot_contract.py'
      - 'tests/language/rooted-file-snapshot.ny'
      - 'tests/language/text-from-bytes*.ny'
      - 'tests/matrix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

# These are real host/interpreter checks for the new web-runtime APIs. LLVM is
# disabled; success does not qualify native socket support or an installed SDK.
jobs:
  runtime:
    name: ${{ matrix.host.name }} interpreter runtime
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        host:
          - {name: Linux x86_64, runner: ubuntu-24.04, python: python3}
          - {name: Windows x86_64, runner: windows-2022, python: python}
          - {name: macOS x86_64, runner: macos-15-intel, python: python3}
          - {name: macOS arm64, runner: macos-15, python: python3}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      NIL_CI_PYTHON: ${{ matrix.host.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record source and host
        timeout-minutes: 2
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path('build/web-parity-evidence')
          root.mkdir(parents=True)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          assert revision == os.environ['GITHUB_SHA']
          report = dict(revision=revision, system=platform.system(), machine=platform.machine(),
                        python=sys.executable, python_version=sys.version,
                        llvm=False, scope='host interpreter runtime; no SDK or native socket qualification')
          (root/'identity.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Configure focused Release build
        timeout-minutes: 8
        run: |
          set -o pipefail
          nil_python_executable="$("$NIL_CI_PYTHON" -c 'import sys; print(sys.executable)')"
          cmake -S . -B build/web-parity \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNIL_ENABLE_LLVM=OFF \
            "-DPython3_EXECUTABLE=$nil_python_executable" \
            -DNILCOMPILER_SQLITE_INCLUDE_DIR=OFF -DNILCOMPILER_POSTGRESQL_INCLUDE_DIR=OFF \
            2>&1 | tee build/web-parity-evidence/configure.log
      - name: Build compiler and focused fixtures
        timeout-minutes: 40
        run: |
          set -o pipefail
          cmake --build build/web-parity --config Release --parallel 2 \
            --target nilcompiler nilinterpreter nil_net_support_tests \
                     nil_net_lifecycle_tests nil_file_time_support_tests \
                     nil_rooted_file_snapshot_tests \
            2>&1 | tee build/web-parity-evidence/build.log
      - name: Run real peer and language contracts
        timeout-minutes: 8
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import json, subprocess
          from pathlib import Path
          pattern = r'^(net[.](support-contract|lifecycle-contract|socket-contract)|nil[.](file-time-support|file-modified-at-contract|rooted-file-snapshot|rooted-file-snapshot-contract)|matrix[.]execution)$'
          base = ['ctest', '--test-dir', 'build/web-parity', '-C', 'Release', '-R', pattern]
          root = Path('build/web-parity-evidence').resolve()
          inventory = subprocess.check_output(base+['--show-only=json-v1'], timeout=30)
          (root/'inventory.json').write_bytes(inventory)
          expected = {'net.support-contract', 'net.lifecycle-contract', 'net.socket-contract',
                      'nil.file-time-support', 'nil.file-modified-at-contract', 'matrix.execution',
                      'nil.rooted-file-snapshot', 'nil.rooted-file-snapshot-contract'}
          assert {test['name'] for test in json.loads(inventory)['tests']} == expected
          with (root/'ctest.log').open('wb') as output:
              result = subprocess.run(base+['--no-tests=error', '--output-on-failure',
                  '--test-output-size-passed', '16384', '--test-output-size-failed', '65536',
                  '--output-junit', str(root/'results.xml')], stdout=output, stderr=subprocess.STDOUT, timeout=450)
          print((root/'ctest.log').read_text(errors='replace'))
          result.check_returncode()
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(root/'results.xml').getroot().iter('testcase'))
          assert len(cases) == len(expected) and {case.get('name') for case in cases} == expected
          assert all(case.get('status') == 'run' and case.find('skipped') is None and case.find('failure') is None and
                     case.find('error') is None for case in cases), 'Unexpected failure or skipped contract'
          PY
      - name: Preserve source identity and evidence
        if: always()
        timeout-minutes: 2
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path('build/web-parity-evidence')
          root.mkdir(parents=True, exist_ok=True)
          contracts = Path('build/web-parity/test-evidence')
          if contracts.is_dir():
              shutil.copytree(contracts, root/'contracts')
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True, timeout=15)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  files[path.relative_to(root).as_posix()] = dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
          (root/'evidence.json').write_text(json.dumps(dict(revision=revision,
              source_unchanged=not dirty, files=files), indent=2)+'\n')
          assert not dirty and revision == os.environ['GITHUB_SHA']
          PY
      - name: Upload complete or partial results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-runtime-${{ matrix.host.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/web-parity-evidence/
          if-no-files-found: error
          retention-days: 14
