name: Web runtime platform checks

"on":
  pull_request:
    paths:
      - '.github/workflows/web-runtime-parity.yml'
      - 'CMakeLists.txt'
      - 'nilcompiler/**'
      - 'nilstd/**'
      - 'common/webview_*'
      - 'common/content_digest.hpp'
      - 'tests/net_*'
      - 'tests/file_time_support_tests.cpp'
      - 'tests/rooted_file_snapshot_tests.cpp'
      - 'tests/webview_*'
      - 'tests/tools/net_socket_contract.py'
      - 'tests/tools/file_modified_at_contract.py'
      - 'tests/tools/rooted_file_snapshot_contract.py'
      - 'tests/tools/webview_intrinsic_contract.py'
      - 'tests/language/rooted-file-snapshot.ny'
      - 'tests/language/text-from-bytes*.ny'
      - 'tests/tools/formatted_text_contract.py'
      - 'tests/tools/markup_contract.py'
      - 'tests/tools/module_alias_contract.py'
      - 'tests/tools/checked_conversion_intrinsic_contract.py'
      - 'tests/console_input_state_tests.cpp'
      - 'tests/durable_file_io_tests.cpp'
      - 'tests/durable_vm_lifecycle_tests.cpp'
      - 'tests/tools/durable_file_io_contract.py'
      - 'tests/tools/ordinary_io_parity_contract.py'
      - 'tests/native_output_staging.py'
      - 'validation/ny-3d/scripts/debugger_process.py'
      - 'tests/language/choice-text-fields*'
      - 'tests/language/secure-hex*'
      - 'tests/language/durable-file-io*'
      - 'tests/language/formatted-text*'
      - 'tests/language/markup*'
      - 'tests/routes/ny_route_matrix.py'
      - 'tests/matrix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

# These are real host/interpreter checks for the new web-runtime APIs. LLVM is
# disabled; success does not qualify native socket support or an installed SDK.
jobs:
  runtime:
    name: ${{ matrix.host.name }} interpreter runtime
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        host:
          - {name: Linux x86_64, runner: ubuntu-24.04, python: python3}
          - {name: Windows x86_64, runner: windows-2022, python: python}
          - {name: macOS x86_64, runner: macos-15-intel, python: python3}
          - {name: macOS arm64, runner: macos-15, python: python3}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      NIL_CI_PYTHON: ${{ matrix.host.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record source and host
        timeout-minutes: 2
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path('build/web-parity-evidence')
          root.mkdir(parents=True)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          assert revision == os.environ['GITHUB_SHA']
          report = dict(revision=revision, system=platform.system(), machine=platform.machine(),
                        python=sys.executable, python_version=sys.version,
                        llvm=False, scope='host interpreter runtime; no SDK or native socket qualification')
          (root/'identity.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report))
          PY
      - name: Configure focused Release build
        timeout-minutes: 8
        run: |
          set -o pipefail
          nil_python_executable="$("$NIL_CI_PYTHON" -c 'import sys; print(sys.executable)')"
          cmake -S . -B build/web-parity \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNIL_ENABLE_LLVM=OFF \
            "-DPython3_EXECUTABLE=$nil_python_executable" \
            -DNILCOMPILER_SQLITE_INCLUDE_DIR=OFF -DNILCOMPILER_POSTGRESQL_INCLUDE_DIR=OFF \
            2>&1 | tee build/web-parity-evidence/configure.log
      - name: Build compiler and focused fixtures
        timeout-minutes: 40
        run: |
          set -o pipefail
          cmake --build build/web-parity --config Release --parallel 2 \
            --target nilcompiler nilinterpreter nilassembler nil_net_support_tests \
                     nil_net_lifecycle_tests nil_file_time_support_tests \
                     nil_rooted_file_snapshot_tests nil_webview_runtime_tests \
                     nil_console_input_state_tests nil_durable_file_io_tests \
                     nil_durable_vm_lifecycle_tests nilruntime \
            2>&1 | tee build/web-parity-evidence/build.log
      - name: Run real peer and language contracts
        timeout-minutes: 8
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          pattern = r'^(net[.](support-contract|lifecycle-contract|socket-contract)|nil[.](file-time-support|file-modified-at-contract|rooted-file-snapshot|rooted-file-snapshot-contract|webview-runtime|webview-intrinsic-contract|formatted-text-contract|markup-contract|module-alias|checked-conversion-intrinsic-contract|console-input-state|durable-file-io)|matrix[.]execution)$'
          base = ['ctest', '--test-dir', 'build/web-parity', '-C', 'Release', '-R', pattern]
          root = Path('build/web-parity-evidence').resolve()
          inventory = subprocess.check_output(base+['--show-only=json-v1'], timeout=30)
          (root/'inventory.json').write_bytes(inventory)
          expected = {'net.support-contract', 'net.lifecycle-contract', 'net.socket-contract',
                      'nil.file-time-support', 'nil.file-modified-at-contract', 'matrix.execution',
                      'nil.rooted-file-snapshot', 'nil.rooted-file-snapshot-contract',
                      'nil.webview-runtime', 'nil.webview-intrinsic-contract',
                      'nil.formatted-text-contract', 'nil.markup-contract',
                      'nil.module-alias', 'nil.checked-conversion-intrinsic-contract',
                      'nil.console-input-state', 'nil.durable-file-io'}
          assert {test['name'] for test in json.loads(inventory)['tests']} == expected
          with (root/'ctest.log').open('wb') as output:
              result = subprocess.run(base+['--no-tests=error', '--output-on-failure',
                  '--test-output-size-passed', '16384', '--test-output-size-failed', '65536',
                  '--output-junit', str(root/'results.xml')], stdout=output, stderr=subprocess.STDOUT, timeout=450)
          print((root/'ctest.log').read_text(errors='replace'))
          result.check_returncode()
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(root/'results.xml').getroot().iter('testcase'))
          assert len(cases) == len(expected) and {case.get('name') for case in cases} == expected
          assert all(case.get('status') == 'run' and case.find('skipped') is None and case.find('failure') is None and
                     case.find('error') is None for case in cases), 'Unexpected failure or skipped contract'
          by_name = {case.get('name'): case for case in cases}
          assert re.fullmatch(r'Console input state: [1-9][0-9]* checks passed\s*',
                             by_name['nil.console-input-state'].findtext('system-out', ''))
          assert by_name['nil.durable-file-io'].findtext('system-out', '').strip() == 'durable-file-io-ok'
          # The Windows helper exercises checked unsupported errors and nonmutation.
          # Do not count its zero-check VM lifecycle or skipped POSIX route as support.
          (root/'durable-platform-boundary.json').write_text(json.dumps({
              'platform': os.name, 'durable_api': 'unsupported' if os.name == 'nt' else 'POSIX',
              'helper_contract': 'nil.durable-file-io', 'helper_status': 'PASS',
              'release_qualification': False}, indent=2)+'\n')
          PY
      - name: Verify POSIX durable publication and lock lifetime
        if: runner.os != 'Windows'
        timeout-minutes: 6
        run: |
          "$NIL_CI_PYTHON" - <<'PYTHON'
          import hashlib, json, re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          BUILD, LLVM = 'build/web-parity', False
          root = Path('build/web-parity-evidence').resolve()
          expected = {'nil.durable-vm-lifecycle', 'nil.durable-file-io-routes'}
          base = ['ctest', '--test-dir', BUILD, '-C', 'Release', '-R',
                  r'^nil[.](durable-vm-lifecycle|durable-file-io-routes)$']
          inventory = subprocess.check_output(base+['--show-only=json-v1'], timeout=30)
          (root/'durable-inventory.json').write_bytes(inventory)
          tests = json.loads(inventory)['tests']
          assert len(tests) == len(expected) and {case['name'] for case in tests} == expected
          with (root/'durable.log').open('wb') as output:
              run = subprocess.run(base+['--no-tests=error', '--output-on-failure',
                  '--test-output-size-passed', '65536', '--output-junit', str(root/'durable-results.xml')],
                  stdout=output, stderr=subprocess.STDOUT, timeout=330)
          print((root/'durable.log').read_text(errors='replace'))
          run.check_returncode()
          cases = list(ET.parse(root/'durable-results.xml').getroot().iter('testcase'))
          assert len(cases) == len(expected) and {case.get('name') for case in cases} == expected
          assert all(case.get('status') == 'run' and all(case.find(kind) is None
              for kind in ['failure', 'error', 'skipped']) for case in cases)
          lifecycle = next(case for case in cases if case.get('name') == 'nil.durable-vm-lifecycle')
          assert re.fullmatch(r'Durable VM lifecycle: [1-9][0-9]* checks passed\s*', lifecycle.findtext('system-out', ''))
          reports = list(Path(BUILD, 'durable-io-evidence').glob('run-*/report.json'))
          assert len(reports) == 1, reports
          proof = json.loads(reports[0].read_text())
          assert proof['schema'] == 'nil.durable-file-io.v1' and proof['status'] == 'PASS'
          assert proof['scope'] == 'POSIX_SOURCE_RUNTIME_NOT_RELEASE_OR_POWER_CUT_QUALIFICATION'
          assert proof['llvm_enabled'] is LLVM and proof['cleanup_verified'] is True
          routes = ['text-vm', 'binary-vm'] + (['aot', 'jit'] if LLVM else [])
          expected_routes = {(language, language+'-'+route) for language in ['ny', 'matrix'] for route in routes}
          assert len(proof['executions']) == len(expected_routes)
          assert {(row['language'], row['route']) for row in proof['executions']} == expected_routes
          oracle = {'bytes': 'exact', 'modes': '0600', 'remaining_staging_files': 0,
                    'lock_after_process_completion': 'released', 'private_directories': ['private'],
                    'directory_modes': '0700'}
          assert all(row['status'] == 'PASS' and row['oracle'] == oracle for row in proof['executions'])
          invalid = ['width', 'owner', 'query-width', 'query-owner']
          negative_routes = ['text-vm', 'binary-vm'] + (['llvm-aot'] if LLVM else [])
          expected_negative = {(case, route) for case in invalid for route in negative_routes}
          assert len(proof['negative_abi']) == len(expected_negative)
          assert {(row['case'], row['route']) for row in proof['negative_abi']} == expected_negative
          assert all(row['status'] == 'PASS' for row in proof['negative_abi'])
          operations = ['file.write_bytes_durable', 'file.sync_directory', 'file.acquire_file_lock',
                        'file.release_file_lock', 'file.file_lock_is_held', 'file.create_private_directory',
                        'file.is_private_regular_file', 'file.is_private_directory', 'checksum.sha256_hex']
          expected_library = {(operation, route, schema) for operation in operations
                              for route in ['text-vm', 'binary-vm'] for schema in ['present', 'absent']}
          assert len(proof['negative_library']) == len(expected_library) == 36
          assert {(row['operation'], row['route'], row['schema']) for row in proof['negative_library']} == expected_library
          assert all(row['status'] == 'PASS' and row['filesystem'] == 'unchanged' for row in proof['negative_library'])
          expected_commands = {'runtime-selection': False}
          for language in ['ny', 'matrix']:
              for encoding in ['text', 'binary']:
                  expected_commands[language+'-compile-'+encoding] = False
                  expected_commands[language+'-'+encoding+'-vm'] = False
              if LLVM:
                  expected_commands.update({language+'-compile-aot': False, language+'-aot': False,
                                            language+'-jit': False})
          for case in invalid:
              for encoding in ['text', 'binary']:
                  expected_commands['compile-invalid-'+case+'-'+encoding] = False
                  expected_commands['invalid-'+case+'-'+encoding] = True
              if LLVM:
                  expected_commands['invalid-'+case] = True
          for operation in operations:
              for encoding in ['text', 'binary']:
                  for schema in ['schema', 'no-schema']:
                      expected_commands['foreign-'+operation+'-'+encoding+'-'+schema] = True
          assert len(proof['commands']) == len(expected_commands)
          assert {row['name'] for row in proof['commands']} == set(expected_commands)
          for row in proof['commands']:
              assert row['cleanup_verified'] is True and not row.get('timed_out') and not row.get('error')
              rejection = expected_commands[row['name']]
              assert row.get('expected_rejection', False) is rejection
              assert row['status'] == ('FAIL' if rejection else 'PASS')
              assert isinstance(row['exit_code'], int) and (row['exit_code'] != 0 if rejection else row['exit_code'] == 0)
          command = next(test['command'] for test in tests if test['name'] == 'nil.durable-file-io-routes')
          inputs = {name: Path(command[command.index('--'+name)+1]).resolve()
                    for name in ['compiler', 'interpreter', 'runtime']}
          inputs.update({'runner': Path('tests/tools/durable_file_io_contract.py').resolve(),
                         'ny': Path('tests/language/durable-file-io.ny').resolve(),
                         'matrix': Path('tests/matrix/io/durable-file-io.matrix').resolve()})
          for case in invalid:
              filename = ('query-invalid-'+case[len('query-'):]) if case.startswith('query-') else 'invalid-'+case
              inputs[case] = Path('tests/language/durable-file-io-'+filename+'.ny').resolve()
          def record(path):
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024*1024), b''):
                      hasher.update(chunk)
              return {'bytes': path.stat().st_size, 'sha256': hasher.hexdigest()}
          assert proof['inputs_before'] == proof['inputs_after'] == {name: record(path) for name, path in inputs.items()}
          if LLVM:
              assert Path(proof['selected_native_runtime']).resolve() == inputs['runtime']
          print('Durable routes verified:', len(expected_routes), 'executions,', len(expected_negative),
                'ABI controls,', len(expected_library), 'library controls')
          PYTHON
      - name: Run formatted text and markup on every interpreted artifact route
        timeout-minutes: 6
        run: |
          "$NIL_CI_PYTHON" - <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('build/web-parity-evidence').resolve()
          tests = json.loads((root/'inventory.json').read_text())['tests']
          command = next(test['command'] for test in tests if test['name'] == 'nil.markup-contract')
          compiler = command[command.index('--compiler')+1]
          interpreter = command[command.index('--interpreter')+1]
          routes = ['text-interpreter', 'binary-interpreter', 'bundle-text', 'bundle-binary']
          for fixture in ['formatted-text', 'formatted-text-matrix', 'markup', 'markup-matrix']:
              language = 'matrix' if fixture.endswith('-matrix') else 'ny'
              report = root/(fixture+'-routes.json')
              subprocess.run([sys.executable, 'tests/routes/ny_route_matrix.py',
                  '--compiler', compiler, '--interpreter', interpreter,
                  '--source', f'tests/language/{fixture}.{language}',
                  '--expected-stdout', f'tests/language/{fixture}.stdout', '--expected-exit', '0',
                  '--routes', ','.join(routes), '--strict', '--compiler-arg=--sdk-path',
                  '--compiler-arg='+str(Path('nilstd/src').resolve()),
                  '--work-dir', 'build/web-parity/language-routes', '--report-json', str(report)],
                  check=True, timeout=75)
              data = json.loads(report.read_text())
              assert len(data['results']) == 4 and all(item['status'] == 'PASS' for item in data['results'])
          PYTHON
      - name: Run choice fields and secure hex on every interpreted artifact route
        timeout-minutes: 6
        run: |
          "$NIL_CI_PYTHON" - <<'PYTHON'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('build/web-parity-evidence').resolve()
          tests = json.loads((root/'inventory.json').read_text())['tests']
          command = next(test['command'] for test in tests if test['name'] == 'nil.markup-contract')
          compiler = command[command.index('--compiler')+1]
          interpreter = command[command.index('--interpreter')+1]
          routes = ['text-interpreter', 'binary-interpreter', 'bundle-text', 'bundle-binary']
          for fixture in ['choice-text-fields', 'choice-text-fields-matrix', 'secure-hex', 'secure-hex-matrix']:
              language = 'matrix' if fixture.endswith('-matrix') else 'ny'
              report = root/(fixture+'-routes.json')
              subprocess.run([sys.executable, 'tests/routes/ny_route_matrix.py',
                  '--compiler', compiler, '--interpreter', interpreter,
                  '--source', f'tests/language/{fixture}.{language}',
                  '--expected-stdout', f'tests/language/{fixture}.stdout', '--expected-exit', '0',
                  '--routes', ','.join(routes), '--strict', '--compiler-arg=--sdk-path',
                  '--compiler-arg='+str(Path('nilstd/src').resolve()),
                  '--work-dir', 'build/web-parity/language-routes', '--report-json', str(report)],
                  check=True, timeout=75)
              data = json.loads(report.read_text())
              assert len(data['results']) == len(routes) and {item['route'] for item in data['results']} == set(routes)
              assert all(item['status'] == item['raw_status'] == 'PASS' for item in data['results'])
          PYTHON
      - name: Preserve source identity and evidence
        if: always()
        timeout-minutes: 2
        run: |
          "$NIL_CI_PYTHON" - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path('build/web-parity-evidence')
          root.mkdir(parents=True, exist_ok=True)
          contracts = Path('build/web-parity/test-evidence')
          if contracts.is_dir():
              shutil.copytree(contracts, root/'contracts')
          durable = Path('build/web-parity/durable-io-evidence')
          if durable.is_dir():
              shutil.copytree(durable, root/'durable-io')
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True, timeout=15)
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=15).strip()
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  files[path.relative_to(root).as_posix()] = dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
          (root/'evidence.json').write_text(json.dumps(dict(revision=revision,
              source_unchanged=not dirty, files=files), indent=2)+'\n')
          assert not dirty and revision == os.environ['GITHUB_SHA']
          PY
      - name: Upload complete or partial results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-runtime-${{ matrix.host.runner }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/web-parity-evidence/
          if-no-files-found: error
          retention-days: 14
